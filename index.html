<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iratan Nascimento — Poesia</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060404;
      --paper: #130e0d;
      --ink: #FFEDCF;
      --muted: #e4d2b4;
      --accent: #f39410;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      line-height: 1.7;
    }

    header {
      padding: 5rem 2rem 3rem;
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    header p {
      color: var(--muted);
      max-width: 700px;
      margin: auto;
      font-size: 1.1rem;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
    }

    .poem {
      background: var(--paper);
      padding: 3rem;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }

    .poem h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .meta {
      color: var(--accent);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    pre {
      white-space: pre-wrap;
      font-family: 'Inter', sans-serif;
      font-size: 1.05rem;
      margin: 0;
    }

    footer {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    nav {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 3rem;
      flex-wrap: wrap;
    }

    nav button {
      background: none;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.6rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.3s;
    }

    nav button:hover {
      background: var(--accent);
      color: var(--bg);
    }

    @media (max-width: 600px) {
      header h1 { font-size: 2.2rem; }
      .poem { padding: 2rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Iratan Nascimento</h1>
  <p>
    Poeta do sertão baiano, nascido em Paulo Afonso. Escreve cordéis e poesias desde a adolescência, 
    reverenciando a vida na caatinga, a cultura sertaneja e as histórias de resistência, afeto e sonho.
  </p>

  <nav id="menu"></nav>
</header>

<main id="content"></main>

<footer>
  © Iratan Nascimento — Poesia e Cordel
</footer>

<script src="cordeis.js"></script>

</body>
</html>
